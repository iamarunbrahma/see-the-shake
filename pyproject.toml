[project]
name = "see-the-shake"
version = "0.1.0"
description = "Measure, magnify and diagnose machine vibration from a slow-motion phone clip"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.8",
  "matplotlib>=3.8",
  "openai>=1.40",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
