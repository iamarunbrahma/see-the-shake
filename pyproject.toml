[project]
name = "see-the-shake"
version = "0.1.0"
description = "Measure, magnify and diagnose machine vibration from a slow-motion phone clip"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.13",
  "opencv-python-headless>=5.0",
  "matplotlib>=3.9",
  "openai>=3.0",
  "meta_sam_parser>=0.0.6",
]

[project.optional-dependencies]
web = ["fastapi>=0.133", "starlette>=1.3.1", "uvicorn>=0.29", "h11>=0.16", "python-multipart>=0.0.31"]
dev = ["pytest>=9.0.3", "pytest-timeout>=2.3.1", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A hang fails fast with every thread's stack (thread method works even inside C code). The first test also pays
# for rendering the cached twin clips, about 2 minutes cold.
timeout = 300
timeout_method = "thread"
faulthandler_timeout = 240
