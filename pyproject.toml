[project]
name = "see-the-shake"
version = "0.1.0"
description = "Measure, magnify and diagnose machine vibration from a slow-motion phone clip"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "scipy>=1.11",
  "opencv-python-headless>=4.8",
  "matplotlib>=3.8",
  "openai>=1.40",
  "meta_sam_parser>=0.0.6",
]

[project.optional-dependencies]
web = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "pytest-timeout>=2.3"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shake"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A hang fails fast with every thread's stack (thread method works even inside C code). The first test also pays
# for rendering the cached twin clips, about 2 minutes cold.
timeout = 300
timeout_method = "thread"
faulthandler_timeout = 240
